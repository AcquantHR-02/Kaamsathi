$kind: http-request
description: |-
  No token.
  
  Expected: 401
url: '{{baseUrl}}/api/companies/me/logo'
method: PUT
auth:
  type: noauth
body:
  type: formdata
  content:
    - key: file
      type: file
      src: 'postman/files/photo.png'
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
    language: text/javascript
