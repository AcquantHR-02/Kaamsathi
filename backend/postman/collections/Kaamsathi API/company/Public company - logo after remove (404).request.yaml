$kind: http-request
description: |-
  No logo any more.
  
  Expected: 404 FILE_NOT_FOUND
url: '{{baseUrl}}/api/companies/{{companyId}}/logo'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      pm.test('code FILE_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('FILE_NOT_FOUND'));
    language: text/javascript
order: 14570
