$kind: http-request
description: |-
  Owner removes the logo (file deleted).
  
  Expected: 204
url: '{{baseUrl}}/api/companies/me/logo'
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{ownerAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 14560
