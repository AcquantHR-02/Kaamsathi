$kind: http-request
description: |-
  Logo bytes for an <img>, no login.
  
  Expected: 200 image/png
url: '{{baseUrl}}/api/companies/{{companyId}}/logo'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('png image', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('image/png'));
    language: text/javascript
order: 14550
