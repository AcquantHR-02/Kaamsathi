$kind: http-request
description: |-
  A blocked job is gone from the public job page (and search).

  Expected: 404 {"code":"JOB_NOT_FOUND", ...}
url: '{{baseUrl}}/api/jobs/{{jobId}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      pm.test('code JOB_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('JOB_NOT_FOUND'));
    language: text/javascript
order: 14600
