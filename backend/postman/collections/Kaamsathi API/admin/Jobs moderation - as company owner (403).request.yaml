$kind: http-request
description: |-
  Only ADMIN.

  Expected: 403 {"code":"ACCESS_DENIED", ...}
url: '{{baseUrl}}/api/admin/jobs'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jobOwnerAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
    language: text/javascript
order: 14000
