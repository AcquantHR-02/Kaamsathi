$kind: http-request
description: |-
  Admin blocks {{jobId}}. Reason trimmed. Company team gets a JOB_BLOCKED message.

  Expected: 200 {"status":"BLOCKED","blockedReason":"Asks applicants for money", ...}
url: '{{baseUrl}}/api/admin/jobs/{{jobId}}/block'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
body:
  type: json
  content: |-
    {
      "reason": "  Asks applicants for money  "
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('BLOCKED with trimmed reason', () => {
          const b = pm.response.json();
          pm.expect(b.status).to.eql('BLOCKED');
          pm.expect(b.blockedReason).to.eql('Asks applicants for money');
      });
    language: text/javascript
order: 14400
