$kind: http-request
description: |-
  BLOCKED → CLOSED (company may reopen it), reason cleared.

  Expected: 200 {"status":"CLOSED","blockedReason":null, ...}
url: '{{baseUrl}}/api/admin/jobs/{{jobId}}/unblock'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('CLOSED, reason cleared', () => {
          const b = pm.response.json();
          pm.expect(b.status).to.eql('CLOSED');
          pm.expect(b.blockedReason).to.eql(null);
      });
    language: text/javascript
order: 14900
