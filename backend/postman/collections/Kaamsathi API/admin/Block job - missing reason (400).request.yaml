$kind: http-request
description: |-
  Reason is required (the company sees it).

  Expected: 400 {"code":"VALIDATION_FAILED", ...}
url: '{{baseUrl}}/api/admin/jobs/{{jobId}}/block'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
body:
  type: json
  content: |-
    {
      "reason": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('code VALIDATION_FAILED', () => pm.expect(pm.response.json().code).to.eql('VALIDATION_FAILED'));
    language: text/javascript
order: 14200
