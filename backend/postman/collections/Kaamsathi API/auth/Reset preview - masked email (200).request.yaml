$kind: http-request
description: |-
  Reset page shows whose account the link is for, masked. The link stays usable.
  
  Expected: 200 {"maskedEmail":"s•••@test.com"}
url: '{{baseUrl}}/api/auth/reset-password/{{resetToken}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('masked email', () => pm.expect(pm.response.json().maskedEmail).to.match(/^.•••@/));
    language: text/javascript
order: 21500
