$kind: http-request
description: |-
  A reviewed payment can not be reviewed again.

  Expected: 409 {"code":"PAYMENT_NOT_PENDING", ...}
url: '{{baseUrl}}/api/admin/payments/{{paymentId}}/approve'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 Conflict', () => pm.response.to.have.status(409));
      pm.test('code PAYMENT_NOT_PENDING', () => pm.expect(pm.response.json().code).to.eql('PAYMENT_NOT_PENDING'));
    language: text/javascript
order: 16600
