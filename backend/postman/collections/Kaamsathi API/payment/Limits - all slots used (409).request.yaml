$kind: http-request
description: |-
  Pre-request fills the company up to 15 ACTIVE jobs (= plan slots). One more → 409.

  Expected: 409 {"code":"JOB_SLOTS_FULL", ...}
url: '{{baseUrl}}/api/jobs'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appOwnerToken}}'
body:
  type: json
  content: |-
    {
      "title": "One job too many",
      "description": "Plan limit test job.",
      "categoryId": "{{appCategoryId}}",
      "cityId": "{{appCityId}}",
      "workMode": "ONSITE",
      "jobType": "FULL_TIME",
      "experienceMin": 0,
      "skillIds": [
        "{{appSkillId}}"
      ]
    }
scripts:
  - type: beforeRequest
    code: |-
      // post filler jobs until the company has 15 live jobs; the main request is the next one
      const v = (k) => pm.variables.get(k);   // all scopes (CLI --env-var baseUrl wins)
      const auth = { 'Authorization': 'Bearer ' + v('appOwnerToken') };
      const filler = {
          url: v('baseUrl') + '/api/jobs',
          method: 'POST',
          header: Object.assign({ 'Content-Type': 'application/json' }, auth),
          body: { mode: 'raw', raw: JSON.stringify({ title: 'Filler job', description: 'Uses up a slot.',
              categoryId: v('appCategoryId'), workMode: 'REMOTE', jobType: 'INTERNSHIP', experienceMin: 0, skillIds: [v('appSkillId')] }) }
      };
      const postMore = (left) => {
          if (left <= 0) return;
          pm.sendRequest(filler, (err, res) => {
              if (err || res.code !== 201) { console.log('filler job failed', err || res.code); return; }
              postMore(left - 1);
          });
      };
      pm.sendRequest({ url: v('baseUrl') + '/api/jobs/mine', method: 'GET', header: auth }, (err, res) => {
          const jobs = res.json();
          const have = jobs.filter(j => j.status === 'ACTIVE').length;
          postMore(15 - have);
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('409 Conflict', () => pm.response.to.have.status(409));
      pm.test('code JOB_SLOTS_FULL', () => pm.expect(pm.response.json().code).to.eql('JOB_SLOTS_FULL'));
    language: text/javascript
order: 17300
