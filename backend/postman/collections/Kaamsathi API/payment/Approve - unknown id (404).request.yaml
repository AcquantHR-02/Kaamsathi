$kind: http-request
description: |-
  No such payment.

  Expected: 404 {"code":"PAYMENT_NOT_FOUND", ...}
url: '{{baseUrl}}/api/admin/payments/00000000-0000-0000-0000-000000000000/approve'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      pm.test('code PAYMENT_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('PAYMENT_NOT_FOUND'));
    language: text/javascript
order: 16400
