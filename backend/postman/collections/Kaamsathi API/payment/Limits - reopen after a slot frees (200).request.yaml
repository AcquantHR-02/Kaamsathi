$kind: http-request
description: |-
  One slot is free again → reopen works.

  Expected: 200 {"status":"ACTIVE", ...}
url: '{{baseUrl}}/api/jobs/{{appClosedJobId}}/reopen'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appOwnerToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('ACTIVE again', () => pm.expect(pm.response.json().status).to.eql('ACTIVE'));
    language: text/javascript
order: 17600
