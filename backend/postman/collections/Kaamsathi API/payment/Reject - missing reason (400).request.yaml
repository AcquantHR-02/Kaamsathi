$kind: http-request
description: |-
  Reason is required (blank = missing).

  Expected: 400 {"code":"VALIDATION_FAILED","message":"reason: reason is required", ...}
url: '{{baseUrl}}/api/admin/payments/{{paymentId}}/reject'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
body:
  type: json
  content: |-
    {
      "reason": "  "
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('VALIDATION_FAILED on reason', () => {
          const b = pm.response.json();
          pm.expect(b.code).to.eql('VALIDATION_FAILED');
          pm.expect(b.message).to.include('reason');
      });
    language: text/javascript
order: 16300
