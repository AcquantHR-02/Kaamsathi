$kind: http-request
description: |-
  Mark everything read.

  Expected: 204
url: '{{baseUrl}}/api/notifications/read-all'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appSeekerToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 8000
