$kind: http-request
description: |-
  No token → 401.

  Expected: 401 {"code":"INVALID_TOKEN", ...}
url: '{{baseUrl}}/api/notifications'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000
