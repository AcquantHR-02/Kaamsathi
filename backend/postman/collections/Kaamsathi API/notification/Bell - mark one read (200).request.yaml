$kind: http-request
description: |-
  Mark {{notificationId}} as read.

  Expected: 200 {"read":true,"readAt":"...", ...}
url: '{{baseUrl}}/api/notifications/{{notificationId}}/read'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appSeekerToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('read now', () => {
          const b = pm.response.json();
          pm.expect(b.read).to.eql(true);
          pm.expect(b.readAt).to.be.a('string');
      });
    language: text/javascript
order: 5000
